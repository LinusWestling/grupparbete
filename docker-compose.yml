services:
  db:
    image: mysql:8.0
    container_name: grupparbete_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: skillswap
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpassword
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  adminer:
    image: adminer:latest
    container_name: grupparbete_adminer
    restart: always
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      - db

volumes:
  mysql_data:
